<!-- chatbot.html — the shell. chatbot.js renders the thread from /api/chat's event
     stream; nothing in here is populated at mount except the app name in the header. -->
<button class="chat-launcher" data-open type="button" aria-expanded="false" aria-controls="chat-panel">
  <span class="chat-launcher-icon" aria-hidden="true">
    <svg viewBox="0 0 20 20"><path d="M3.5 4.5h13a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H8l-4 3v-3H3.5a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1Z"/></svg>
  </span>
  <span class="chat-launcher-label">Ask</span>
</button>

<section class="chat-panel" id="chat-panel" hidden aria-label="Capability chat">
  <header class="chat-head">
    <div class="chat-title">
      <div class="chat-title-row">
        <h2>Ask the agent</h2>
        <span class="chat-scope mono" data-scope hidden></span>
      </div>
      <p class="chat-sub">It can only do what you have approved.</p>
    </div>
    <div class="chat-head-actions">
      <!-- A compose mark, not a circular arrow: this starts a new conversation, and an
           arrow chasing its tail reads as "retry that last thing". Not a trash can
           either — that means "delete the evidence" everywhere else in the console. -->
      <button class="icon" data-clear type="button" title="New conversation">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.5 8.6V12A1.5 1.5 0 0 1 12 13.5H4A1.5 1.5 0 0 1 2.5 12V4A1.5 1.5 0 0 1 4 2.5h3.4"/>
          <path d="M11.2 2.5a1.25 1.25 0 0 1 1.8 1.8L8.7 8.6l-2.3.5.5-2.3 4.3-4.3Z"/>
        </svg>
        <span class="sr">New conversation</span>
      </button>
    </div>
  </header>

  <div class="chat-thread" data-thread tabindex="0"></div>

  <form class="chat-composer" data-composer>
    <textarea data-input rows="1" placeholder="Ask for something…" aria-label="Message"></textarea>
    <button class="chat-send" data-send type="submit" title="Send">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M4 7l4-3.5L12 7"/></svg>
      <span class="sr">Send</span>
    </button>
  </form>
</section>
