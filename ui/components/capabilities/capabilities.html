<!-- capabilities.html — table shell only; capabilities.js renders the rows
     from /api/artifacts and the chevron-expanded details -->
<div class="scroll">
  <table>
    <thead>
      <tr><th>Capability</th><th>State</th><th>Approval</th><th class="replay-head">Replay</th><th class="del-head">Delete</th><th class="right"></th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Asks for a capability's required inputs before replaying it — same steps, new values. -->
<dialog data-params-dialog>
  <h2>Replay parameters</h2>
  <p class="muted intro" data-params-intro></p>
  <div data-params-fields></div>
  <p class="muted err" data-params-error hidden></p>
  <div class="actions">
    <span class="spacer"></span>
    <button class="secondary" data-params-cancel type="button">Cancel</button>
    <button data-params-run type="button">Replay</button>
  </div>
</dialog>
