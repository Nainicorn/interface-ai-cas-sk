<!-- human-in-the-loop.html — markup only. human-in-the-loop.js clones the <template>
     into [data-panel] per intervention and fills [data-goal]/[data-reason]/[data-url]. -->
<h2>Human needed <span class="hint">the run is paused and its browser window is waiting for you</span></h2>
<div class="context">
  <div data-panel></div>
</div>

<template data-panel-template>
  <div class="ask-box">
    <p class="ask"><b data-goal></b> needs you</p>
    <p class="why" data-reason></p>
    <p class="where mono muted" data-url></p>
  </div>

  <section class="handback">
    <h3>Tell the agent what it needs <span class="hint">plain English — it re-reads the page itself</span></h3>

    <p class="how muted">
      Do anything manual in the run's own Chromium window: it is the same session the
      agent is using, so whatever you leave behind is what it sees. Or just say what
      should happen next — the code from an email, a value to enter, which link to take.
    </p>

    <label class="note-field" for="op-note">
      <span class="sr">Message to the agent</span>
      <textarea id="op-note" name="note" rows="2"
                placeholder="The verification code is 481920 — type it into the code box and continue."></textarea>
    </label>

    <div class="handback-row">
      <button data-resume class="small">Hand control back</button>
      <span class="hint">resumes from whatever state the page is in now</span>
    </div>
  </section>

  <p data-feedback class="feedback muted"></p>
</template>
