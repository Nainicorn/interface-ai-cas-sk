<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAS Console</title>
  <script>
    // Inline and first: applying the theme from a module would paint light, then flip.
    try { var t = localStorage.getItem('cas-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/global/styles.css" />
  <link rel="stylesheet" href="/components/sidebar/sidebar.css" />
  <link rel="stylesheet" href="/components/app-modal/app-modal.css" />
  <link rel="stylesheet" href="/components/goal-form/goal-form.css" />
  <link rel="stylesheet" href="/components/live-viewer/live-viewer.css" />
  <link rel="stylesheet" href="/components/human-in-the-loop/human-in-the-loop.css" />
  <link rel="stylesheet" href="/components/tabs/tabs.css" />
  <link rel="stylesheet" href="/components/discoveries/discoveries.css" />
  <link rel="stylesheet" href="/components/capabilities/capabilities.css" />
  <link rel="stylesheet" href="/components/agent-catalog/agent-catalog.css" />
  <link rel="stylesheet" href="/components/chatbot/chatbot.css" />
</head>
<body>
  <button class="theme-toggle" data-theme-toggle type="button"></button>
  <div class="app">
    <!-- Sidebar: your apps, like a conversation list. Main column: run things, watch
         them live, and flip between the run history and the recorded capabilities. -->
    <aside id="app-sidebar"></aside>
    <div class="main">
      <div class="column">
        <section id="goal-form"></section>
        <section id="live-viewer" class="card"></section>
        <section id="operator-console" class="card operator" hidden></section>
        <section id="workspace" class="card"></section>
      </div>
    </div>
  </div>
  <div id="app-editor"></div>
  <!-- The chatbot is a panel over the console, not a page: asking for something and
       watching the run appear in the table behind it is meant to be one moment. -->
  <div id="chatbot"></div>

  <script type="module">
    import { mountThemeToggle } from '/global/theme.js';
    import { mount as appSidebar } from '/components/sidebar/sidebar.js';
    import { mount as appEditor } from '/components/app-modal/app-modal.js';
    import { mount as goalForm } from '/components/goal-form/goal-form.js';
    import { mount as liveViewer } from '/components/live-viewer/live-viewer.js';
    import { mount as operatorConsole } from '/components/human-in-the-loop/human-in-the-loop.js';
    import { mount as workspace } from '/components/tabs/tabs.js';
    import { mount as chatbot } from '/components/chatbot/chatbot.js';

    mountThemeToggle(document.querySelector('[data-theme-toggle]'));
    appSidebar(document.getElementById('app-sidebar'));
    appEditor(document.getElementById('app-editor'));
    goalForm(document.getElementById('goal-form'));
    liveViewer(document.getElementById('live-viewer'));
    operatorConsole(document.getElementById('operator-console'));
    workspace(document.getElementById('workspace'));
    chatbot(document.getElementById('chatbot'));
  </script>
</body>
</html>
