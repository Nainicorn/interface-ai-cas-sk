<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAS Control Plane</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div>
      <h1>Computer-Use Automation</h1>
      <p class="sub">discover once &rarr; typed capability &rarr; deterministic replay &rarr; human handoff when stuck</p>
    </div>
  </header>

  <main>
    <!-- Three regions: goal form top-left; live viewer + operator panel top-right
         (viewer fills with Chromium while a run is live; the operator panel appears
         under it only when a human is needed); runs/capabilities tabs across the bottom. -->
    <section id="goal-form" class="card"></section>
    <div class="right-col">
      <section id="live-viewer" class="card"></section>
      <section id="operator-console" class="card operator" hidden></section>
    </div>
    <section id="workspace" class="card wide"></section>
  </main>

  <script type="module">
    import { mount as goalForm } from '/components/goal-form.js';
    import { mount as liveViewer } from '/components/live-viewer.js';
    import { mount as operatorConsole } from '/components/operator-console.js';
    import { mount as tabs } from '/components/tabs.js';

    goalForm(document.getElementById('goal-form'));
    liveViewer(document.getElementById('live-viewer'));
    operatorConsole(document.getElementById('operator-console'));
    tabs(document.getElementById('workspace'));
  </script>
</body>
</html>
