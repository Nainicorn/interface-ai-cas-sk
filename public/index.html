<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAS Control Plane</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Computer-Use Automation — Control Plane</h1>
    <p class="sub">discover once → typed capability → deterministic replay → human handoff when stuck</p>
  </header>

  <main>
    <section id="goal-form" class="card"></section>
    <section id="operator-console" class="card"></section>
    <section id="run-status" class="card wide"></section>
    <section id="artifact-viewer" class="card"></section>
    <section id="replay-panel" class="card"></section>
  </main>

  <script type="module">
    // One mount per component; each owns its own polling and API calls.
    import { mount as goalForm } from '/components/goal-form.js';
    import { mount as runStatus } from '/components/run-status.js';
    import { mount as operatorConsole } from '/components/operator-console.js';
    import { mount as artifactViewer } from '/components/artifact-viewer.js';
    import { mount as replayPanel } from '/components/replay-panel.js';

    goalForm(document.getElementById('goal-form'));
    operatorConsole(document.getElementById('operator-console'));
    runStatus(document.getElementById('run-status'));
    artifactViewer(document.getElementById('artifact-viewer'));
    replayPanel(document.getElementById('replay-panel'));
  </script>
</body>
</html>
