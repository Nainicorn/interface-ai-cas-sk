<!-- target-modal.html — the Add-app dialog; target-modal.js opens it, collects the form, posts it -->
<dialog data-dialog>
  <h2>Add an app</h2>
  <p class="muted intro">
    Point the agent at any web app you're allowed to automate — a sandbox or demo,
    never real customer data. Logins stay on this machine in a gitignored file;
    only their <em>names</em> ever appear in config, artifacts, or logs.
  </p>

  <label>Friendly name</label>
  <input name="display_name" placeholder="Acme Banking Sandbox" />

  <label>URL</label>
  <input name="base_url" placeholder="https://sandbox.example.com" />

  <div class="row">
    <div>
      <label>Start path</label>
      <input name="entry_route" value="/" />
    </div>
    <div>
      <label>Allowed paths <span class="hint">agent can't leave these</span></label>
      <input name="route_prefixes" value="/" />
    </div>
  </div>

  <label>Default goal <span class="hint">optional — prefills each run</span></label>
  <input name="goal" placeholder="Look up a member and read their savings balance" />

  <label>Risky paths <span class="hint">optional — require confirmation, e.g. /transfer</span></label>
  <input name="risky" placeholder="" />

  <div class="logins">
    <div class="logins-head">
      <h3>Logins</h3>
      <button class="small secondary" data-add-persona type="button">+ Add login</button>
    </div>
    <div data-personas></div>
  </div>

  <template data-persona-row>
    <div class="persona-row row">
      <div><input name="p-name" placeholder="name, e.g. teller" /></div>
      <div><input name="p-username" placeholder="username" autocomplete="off" /></div>
      <div><input name="p-password" type="password" placeholder="password" autocomplete="new-password" /></div>
      <button class="small secondary remove" data-remove-row type="button" title="Remove this login">×</button>
    </div>
  </template>

  <p class="error" data-error hidden></p>

  <div class="actions">
    <button class="secondary" data-cancel type="button">Cancel</button>
    <button data-save type="button">Add app</button>
  </div>
</dialog>
