<!-- operator-console.html — markup only. operator-console.js clones the <template>
     into [data-panel] per intervention and fills [data-goal]/[data-reason]/[data-url]. -->
<h2>Human needed <span class="hint">the run is paused; you are driving its live browser (above)</span></h2>
<div class="context">
  <div data-panel></div>
</div>

<template data-panel-template>
  <div class="ask-box">
    <p class="ask"><b data-goal></b> needs you</p>
    <p class="why" data-reason></p>
    <p class="where mono muted" data-url></p>
  </div>

  <section class="step">
    <h3>Drive the page <span class="hint">one step at a time, through the agent's own primitives</span></h3>

    <div class="fields">
      <div class="field">
        <label for="op-action">Action</label>
        <select id="op-action" name="action">
          <option>click</option><option>type</option><option>navigate</option><option>read</option>
        </select>
      </div>
      <div class="field">
        <label for="op-kind">Find element by</label>
        <select id="op-kind" name="kind">
          <option>role</option><option>label</option><option>placeholder</option><option>text</option><option>css</option>
        </select>
      </div>
      <div class="field">
        <label for="op-locator">Element name / value</label>
        <input id="op-locator" name="locator" placeholder="Search" />
      </div>
      <div class="field">
        <label for="op-role">Role <span class="hint">when finding by role</span></label>
        <input id="op-role" name="role" placeholder="button" />
      </div>
      <div class="field">
        <label for="op-text">Text to type <span class="hint">type only</span></label>
        <input id="op-text" name="text" />
      </div>
      <div class="field">
        <label for="op-url">Route <span class="hint">navigate only</span></label>
        <input id="op-url" name="url" placeholder="/search" />
      </div>
    </div>

    <div class="step-foot">
      <button data-act class="small">Perform manual step</button>
    </div>
  </section>

  <section class="handback">
    <h3>Hand control back <span class="hint">the agent re-reads the page as you left it</span></h3>
    <div class="handback-row">
      <div class="field">
        <label for="op-note">Note for the agent</label>
        <input id="op-note" name="note" placeholder="Signed back in; session had expired" />
      </div>
      <button data-resume class="small secondary">Hand control back</button>
    </div>
  </section>

  <p data-feedback class="feedback muted"></p>
</template>
