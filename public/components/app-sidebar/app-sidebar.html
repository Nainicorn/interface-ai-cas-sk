<!-- app-sidebar.html — brand + the registered apps; app-sidebar.js renders the list and owns selection -->
<div class="brand">
  <strong>CAS Console</strong>
  <span class="sub">computer-use automation</span>
</div>

<button class="add" data-add>+ Add app</button>

<div class="side-label">Your apps</div>
<ul class="apps" data-apps></ul>

<div class="app-menu" data-menu-popup hidden>
  <button data-edit type="button">Edit</button>
  <button data-delete type="button">Delete</button>
</div>
<p class="muted side-empty" data-empty hidden>
  No apps yet. Add the URL you want the agent to work on — any sandbox or demo app
  you're allowed to automate.
</p>
