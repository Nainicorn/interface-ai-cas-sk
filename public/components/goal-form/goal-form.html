<!-- goal-form.html — markup only; goal-form.js binds it to the sidebar's selected app -->
<h2 class="ask">What should the agent do?</h2>
<p class="muted" data-noapp>Add an app in the sidebar to get started.</p>
<div data-form hidden>
  <div class="prompt-box">
    <div class="goal" data-goal-text></div>
    <div class="prompt-foot">
      <span class="app-chip muted">on <strong data-app-name></strong></span>
      <button title="Run the agent">Run</button>
    </div>
  </div>
  <p class="muted" data-status></p>
</div>
