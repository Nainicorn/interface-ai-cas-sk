<!-- goal-form.html — markup only; goal-form.js binds it to the sidebar's selected app -->
<h2 class="ask">What should the agent do?</h2>
<p class="muted" data-noapp>Add an app in the sidebar to get started.</p>
<div data-form hidden>
  <div class="prompt-box">
    <input class="goal" name="goal" placeholder="Describe the goal — e.g. Look up member 10001 and read their savings balance" />
    <div class="prompt-foot">
      <span class="app-chip muted">on <strong data-app-name></strong></span>
      <span data-goals-wrap hidden class="foot-field">
        <select name="saved_goal" title="Saved goals"></select>
      </span>
      <span data-persona-wrap hidden class="foot-field">
        <select name="persona" title="Login"></select>
      </span>
      <input class="foot-field params" name="params" placeholder="params (optional) — member_id=10001" />
      <button title="Run the agent">Run</button>
    </div>
  </div>
  <p class="muted hint-line">Every run is its own test — change the goal, login, or params each time.</p>
  <p class="muted" data-status></p>
</div>
